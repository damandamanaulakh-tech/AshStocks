name: Keep ASH Stock auto engine awake

on:
  schedule:
    # UTC: 09:00-09:25 IST, weekdays.
    - cron: "30-59/5 3 * * 1-5"
    # UTC: 09:30-15:25 IST, weekdays.
    - cron: "*/5 4-9 * * 1-5"
    # UTC: NSE close at 15:30 IST.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ashstocks-market-hours-wake
  cancel-in-progress: true

jobs:
  wake-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep the server-side paper engine running
        run: >-
          curl --fail --silent --show-error
          --max-time 90
          --retry 2
          --retry-delay 10
          https://ashstocks.onrender.com/api/health
          > /dev/null
